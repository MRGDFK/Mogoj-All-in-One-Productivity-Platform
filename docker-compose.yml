services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mogoj
      POSTGRES_PASSWORD: mogoj
      POSTGRES_DB: mogoj
    ports:
      - "5432:5432"
    volumes:
      - mogoj_postgres_data:/var/lib/postgresql/data

volumes:
  mogoj_postgres_data:
