services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mogoj
      POSTGRES_PASSWORD: mogoj
      POSTGRES_DB: mogoj
    ports:
      - "5433:5432"  # 5433 on the host: avoids clashing with a local Homebrew Postgres
    volumes:
      - mogoj_postgres_data:/var/lib/postgresql/data

volumes:
  mogoj_postgres_data:
